# Gameplay balance. Values are read once at launch. See docs/balance.md.
# Edit values, then restart the game. Missing keys retain built-in defaults.
# An invalid/unknown/duplicate setting rejects the entire file.

# player
# Walking speed in metres/second. Allowed: 0.5..6.
player.walk_speed = 2.5
# Sprinting speed in metres/second. Allowed: 0.5..10.
player.sprint_speed = 4.0
# Crouched speed in metres/second. Allowed: 0.1..3.
player.crouch_speed = 1.1
# Acceleration in metres/second squared. Allowed: 0.5..40.
player.acceleration = 8.
# Braking/reversal acceleration in metres/second squared. Allowed: 0.5..60.
player.braking = 18.

# stamina
# Stamina consumed per second of actual sprint travel. Allowed: 0.1..100.
stamina.drain_per_second = 12.
# Stamina restored per second after the delay. Allowed: 0.1..100.
stamina.recovery_per_second = 14.
# Seconds before stamina starts recovering. Allowed: 0..10.
stamina.recovery_delay = 1.5
# Stamina required to resume sprinting after exhaustion. Allowed: 1..100.
stamina.resume_threshold = 22.

# aranea
# Patrol movement speed in metres/second. Allowed: 0.1..5.
aranea.wander_speed = 1.2
# Chase/search movement speed in metres/second. Allowed: 0.1..10.
aranea.chase_speed = 3.6
# Speed multiplier after collecting the Level 0 key. Allowed: 1..2.
aranea.enraged_multiplier = 1.35
# Initial quiet time before ordinary spawning, in seconds. Allowed: 0..120.
aranea.spawn_grace = 8.
# Minimum spawn/entrance-clearance distance in metres. Allowed: 8..60.
aranea.spawn_min_distance = 24.0
# Maximum spawn distance in metres; blocked/unloaded positions still rejected. Allowed: 8..60.
aranea.spawn_max_distance = 32.0
# Sight distance within the existing 24-metre visibility query. Allowed: 1..24.
aranea.sight_range = 22.
# Search time after losing sight and sound. Allowed: 0.1..60.
aranea.memory_seconds = 5.
# Contact distance; independent jumpscare camera tuning stays in jumpscare.cfg. Allowed: 0.5..1.
aranea.catch_distance = .62
# Minimum actual player speed that creates footsteps for hearing. Allowed: 0.01..2.
aranea.hearing_motion_threshold = .12
# Base footstep hearing distance in metres. Allowed: 0..12.
aranea.hearing_base = 2.0
# Extra hearing distance for each metre/second of player movement. Allowed: 0..10.
aranea.hearing_per_speed = 3.5
# Maximum footstep hearing distance before crouch/wall attenuation. Allowed: 0..48.
aranea.hearing_max = 18.0
# Footstep hearing multiplier when crouched. Allowed: 0..1.
aranea.crouch_hearing_multiplier = .28
# Hearing distance for a full-volume interaction event. Allowed: 0..48.
aranea.door_hearing_range = 20.0
# Hearing multiplier when line of sight is blocked. Allowed: 0..1.
aranea.wall_hearing_multiplier = .45
# Local alarm range before spatial transmission attenuation. Allowed: 1..100.
aranea.alarm_range = 48.0
# Lifetime of a pending alarm, in seconds. Allowed: 0.1..60.
aranea.alarm_memory_seconds = 5.
# Maximum patrol turn rate in radians/second. Allowed: 0.5..12.
aranea.walk_turn_rate = 6.
# Maximum pursuit turn rate in radians/second. Allowed: 0.5..18.
aranea.chase_turn_rate = 9.

# mouse
# Mouse approach speed in metres/second. Allowed: 0.1..4.5.
mouse.approach_speed = 1.65
# Mouse speed after its alarm, in metres/second. Allowed: 0.1..4.5.
mouse.flee_speed = 2.1

# partygoer
# Unobserved Partygoer speed in metres/second. Allowed: 0.1..10.
partygoer.speed = 4.875
# Partygoer speed while following an alarm. Allowed: 0.1..12.
partygoer.alarm_speed = 7.5
# Partygoer alarm duration in seconds. Allowed: 0.1..30.
partygoer.alarm_seconds = 6.

# darkness
# Parking eyes pursuit speed in metres/second. Allowed: 0.1..6.
darkness.chase_speed = 4.8
# Maximum flashlight repulsion range in metres. Allowed: 1..30.
darkness.flashlight_range = 18.
# Parking eyes contact distance in metres. Allowed: 0.5..1.
darkness.catch_distance = .65
